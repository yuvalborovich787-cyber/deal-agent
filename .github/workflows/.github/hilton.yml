name: Hilton Points Scan

on:
  schedule:
    # פעם ביום (UTC). אם תרצה שעה אחרת בישראל, אגיד לך איך.
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml playwright
          playwright install --with-deps chromium

      - name: Cache seen DB
        uses: actions/cache@v4
        with:
          path: seen.db
          key: seen-db-v1

      - name: Run Hilton scanner
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python hilton_scan.py
